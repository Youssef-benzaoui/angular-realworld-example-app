<div class="banner">
  <div
    class="banner-content"
    [@accordionAnimation]="isExpanded ? 'expanded' : 'collapsed'"
    [attr.aria-expanded]="isExpanded"
    role="region"
    aria-labelledby="banner-title"
  >
    <div class="container">
      <h1 id="banner-title" class="logo-font">conduit</h1>
      <p>A place to share your <i>Angular</i> knowledge.</p>
    </div>
  </div>

  <button
    class="accordion-toggle"
    (click)="toggleExpanded()"
    [attr.aria-label]="isExpanded ? 'Collapse banner' : 'Expand banner'"
    type="button"
  >
    <span class="chevron" [ngClass]="{ rotated: !isExpanded }">▼</span>
  </button>
</div>
